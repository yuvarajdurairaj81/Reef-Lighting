name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reef
          POSTGRES_PASSWORD: reef
          POSTGRES_DB: reef_lighting_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reef" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reef:reef@localhost:5432/reef_lighting_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: backend
      - run: npm run typecheck
      - name: Backend unit tests
        run: npm test --workspace backend
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: backend
      - name: Backend integration tests
        run: npm run test:integration --workspace backend
      - name: Frontend tests
        run: npm test --workspace frontend
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          cp backend/.env.example backend/.env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health && break; sleep 2; done
          docker compose exec -T backend node dist/scripts/seed.js
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
